name: Twitter Discord Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes, 24/7
  workflow_dispatch: # Allows you to manually trigger a run anytime from the GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Give the workflow permission to commit the last_seen.json state update back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit State Changes (last_seen.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update last_seen state [skip ci]"
          file_pattern: last_seen.json
